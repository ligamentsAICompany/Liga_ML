substitutions:
  _REGION: us-central1
  _SERVICE_NAME: liga-ml-intern
  _ARTIFACT_REPO: liga-ml-containers
  _IMAGE_NAME: liga-ml-intern
  _HF_TOKEN_SECRET: hf-token
  _HUGGINGFACE_HUB_TOKEN_SECRET: huggingface-hub-token
  _GITHUB_TOKEN_SECRET: github-token
  _OPENAI_API_KEY_SECRET: openai-api-key
  _AWS_ACCESS_KEY_ID_SECRET: aws-access-key-id
  _AWS_SECRET_ACCESS_KEY_SECRET: aws-secret-access-key
  _AWS_SESSION_TOKEN_SECRET: ""
  _ML_INTERN_DEFAULT_MODEL_ID: moonshotai/Kimi-K2.6
  _GCS_BUCKET: liga-ml
  _VERTEX_AI_SERVICE_ACCOUNT: ""
  _AWS_REGION: ""
  _AWS_S3_BUCKET: ""
  _AWS_S3_PREFIX: liga-ml
  _AWS_SAGEMAKER_ROLE_ARN: ""
  _AWS_SAGEMAKER_TRAINING_IMAGE_URI: ""
  _AWS_DEFAULT_INSTANCE_TYPE: ml.g5.xlarge
  _AWS_DEFAULT_INSTANCE_COUNT: "1"
  _AWS_DEFAULT_MAX_RUN_SECONDS: "7200"
  _AWS_OUTPUT_POLICY: aws-private
  _MONGODB_URI_SECRET: ""
  _SESSION_TOKEN_ENCRYPTION_KEY_SECRET: ""
  _DEFAULT_DAILY_BUDGET_USD: ""
  _DEFAULT_MONTHLY_BUDGET_USD: ""
  _HF_DAILY_BUDGET_USD: ""
  _GCLOUD_DAILY_BUDGET_USD: ""
  _AWS_DAILY_BUDGET_USD: ""
  _AUDIT_TIMELINE_ENABLED: "true"
  _AUDIT_EVENT_RETENTION_DAYS: "30"
  _POST_TRAINING_EVAL_ENABLED: "true"
  _POST_TRAINING_EVAL_MODE: static
  _POST_TRAINING_EVAL_USE_PAID_JUDGE: "false"

steps:
  - id: Ensure Artifact Registry repository
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if ! gcloud artifacts repositories describe "${_ARTIFACT_REPO}" \
          --location="${_REGION}" >/dev/null 2>&1; then
          gcloud artifacts repositories create "${_ARTIFACT_REPO}" \
            --repository-format=docker \
            --location="${_REGION}" \
            --description="Liga ML production containers"
        fi

  - id: Build Docker image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest
      - .

  - id: Push commit image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$COMMIT_SHA

  - id: Push latest image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest

  - id: Deploy to Cloud Run
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SERVICE_ACCOUNT_ARG=()
        if [ -n "${_VERTEX_AI_SERVICE_ACCOUNT}" ]; then
          SERVICE_ACCOUNT_ARG=(--service-account="${_VERTEX_AI_SERVICE_ACCOUNT}")
        fi
        SECRET_MAPPINGS="HF_TOKEN=${_HF_TOKEN_SECRET}:latest,HUGGINGFACE_HUB_TOKEN=${_HUGGINGFACE_HUB_TOKEN_SECRET}:latest,GITHUB_TOKEN=${_GITHUB_TOKEN_SECRET}:latest,OPENAI_API_KEY=${_OPENAI_API_KEY_SECRET}:latest,AWS_ACCESS_KEY_ID=${_AWS_ACCESS_KEY_ID_SECRET}:latest,AWS_SECRET_ACCESS_KEY=${_AWS_SECRET_ACCESS_KEY_SECRET}:latest"
        if [ -n "${_AWS_SESSION_TOKEN_SECRET}" ]; then
          SECRET_MAPPINGS="$${SECRET_MAPPINGS},AWS_SESSION_TOKEN=${_AWS_SESSION_TOKEN_SECRET}:latest"
        fi
        if [ -n "${_MONGODB_URI_SECRET}" ]; then
          SECRET_MAPPINGS="$${SECRET_MAPPINGS},MONGODB_URI=${_MONGODB_URI_SECRET}:latest"
        fi
        if [ -n "${_SESSION_TOKEN_ENCRYPTION_KEY_SECRET}" ]; then
          SECRET_MAPPINGS="$${SECRET_MAPPINGS},SESSION_TOKEN_ENCRYPTION_KEY=${_SESSION_TOKEN_ENCRYPTION_KEY_SECRET}:latest"
        fi

        gcloud run deploy "${_SERVICE_NAME}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$COMMIT_SHA" \
          --region="${_REGION}" \
          --platform=managed \
          --port=8080 \
          --memory=4Gi \
          --cpu=2 \
          --timeout=3600 \
          --concurrency=5 \
          --min-instances=1 \
          --allow-unauthenticated \
          "$${SERVICE_ACCOUNT_ARG[@]}" \
          --set-env-vars="ML_INTERN_DEFAULT_MODEL_ID=${_ML_INTERN_DEFAULT_MODEL_ID},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_REGION=${_REGION},GCS_BUCKET=${_GCS_BUCKET},VERTEX_STAGING_BUCKET=gs://${_GCS_BUCKET}/vertex-staging,VERTEX_OUTPUT_DIR=gs://${_GCS_BUCKET}/vertex-outputs,VERTEX_AI_STAGING_BUCKET=gs://${_GCS_BUCKET}/vertex-staging,VERTEX_AI_OUTPUT_DIR=gs://${_GCS_BUCKET}/vertex-outputs,AWS_REGION=${_AWS_REGION},AWS_S3_BUCKET=${_AWS_S3_BUCKET},AWS_S3_PREFIX=${_AWS_S3_PREFIX},AWS_SAGEMAKER_ROLE_ARN=${_AWS_SAGEMAKER_ROLE_ARN},AWS_SAGEMAKER_TRAINING_IMAGE_URI=${_AWS_SAGEMAKER_TRAINING_IMAGE_URI},AWS_DEFAULT_INSTANCE_TYPE=${_AWS_DEFAULT_INSTANCE_TYPE},AWS_DEFAULT_INSTANCE_COUNT=${_AWS_DEFAULT_INSTANCE_COUNT},AWS_DEFAULT_MAX_RUN_SECONDS=${_AWS_DEFAULT_MAX_RUN_SECONDS},AWS_OUTPUT_POLICY=${_AWS_OUTPUT_POLICY},ML_INTERN_KPIS_DISABLED=1,BACKGROUND_RUNS_ENABLED=true,RUN_WORKER_MODE=in_process,USAGE_DASHBOARD_ENABLED=true,AUDIT_TIMELINE_ENABLED=${_AUDIT_TIMELINE_ENABLED},AUDIT_EVENT_RETENTION_DAYS=${_AUDIT_EVENT_RETENTION_DAYS},POST_TRAINING_EVAL_ENABLED=${_POST_TRAINING_EVAL_ENABLED},POST_TRAINING_EVAL_MODE=${_POST_TRAINING_EVAL_MODE},POST_TRAINING_EVAL_USE_PAID_JUDGE=${_POST_TRAINING_EVAL_USE_PAID_JUDGE},DEFAULT_DAILY_BUDGET_USD=${_DEFAULT_DAILY_BUDGET_USD},DEFAULT_MONTHLY_BUDGET_USD=${_DEFAULT_MONTHLY_BUDGET_USD},HF_DAILY_BUDGET_USD=${_HF_DAILY_BUDGET_USD},GCLOUD_DAILY_BUDGET_USD=${_GCLOUD_DAILY_BUDGET_USD},AWS_DAILY_BUDGET_USD=${_AWS_DAILY_BUDGET_USD}" \
          --set-secrets="$${SECRET_MAPPINGS}"

  - id: Output image names
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Pushed images:"
        echo "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$COMMIT_SHA"
        echo "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest
